[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire"
version = "0.1.0"
description = "Config + runtime checks for live game experiments."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []  # stdlib-only, on purpose -- see README

[project.scripts]
tripwire = "tripwire.cli:main"

[tool.setuptools]
packages = ["tripwire", "tripwire.checks"]
